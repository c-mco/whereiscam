<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="qCoasterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FEE8A2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E5A823" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="35%" stop-color="#FDE8A5"/>
      <stop offset="85%" stop-color="#F5BA38"/>
      <stop offset="100%" stop-color="#E09818"/>
    </linearGradient>
    <linearGradient id="qExtrusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4541B"/>
      <stop offset="60%" stop-color="#9C3408"/>
      <stop offset="100%" stop-color="#25140A"/>
    </linearGradient>
    <filter id="qShadowFilter" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#25140A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Golden Malt Glow -->
  <circle cx="50" cy="50" r="44" fill="url(#qCoasterGlow)"/>

  <!-- Retro Concentric Saloon Dashes / Radar Pips -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D4541B" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#543420" stroke-width="1" opacity="0.35"/>

  <!-- Retro 70s Starburst Sparkle 1 (Top Left) -->
  <path d="M 17 28 C 22 28 23 23 23 18 C 23 23 24 28 29 28 C 24 28 23 33 23 38 C 23 33 22 28 17 28 Z" fill="#D4541B"/>
  <circle cx="23" cy="28" r="1.5" fill="#FFFDF5"/>

  <!-- Retro 70s Starburst Sparkle 2 (Bottom Right) -->
  <path d="M 73 70 C 77 70 78 66 78 62 C 78 66 79 70 83 70 C 79 70 78 74 78 78 C 78 74 77 70 73 70 Z" fill="#E5A823"/>
  <circle cx="78" cy="70" r="1.2" fill="#FFFDF5"/>

  <!-- Retro 70s Mini Sparkle (Upper Right) -->
  <circle cx="77" cy="23" r="2" fill="#D4541B" opacity="0.75"/>

  <g filter="url(#qShadowFilter)">
    <!-- 3D Extrusion Shadow (Block 70s offset down & right) -->
    <g fill="url(#qExtrusion)" transform="translate(4, 5.5)">
      <!-- Hook Extrusion -->
      <path d="M 33 34 C 33 21 43 14 54 14 C 68 14 77 23 77 35 C 77 46 69 52 62 57 C 57 61 55 64 55 69 C 55 71.5 52.5 73 50 73 C 47.5 73 45 71.5 45 69 C 45 61 49 56 55 51 C 60 47 64 43 64 36 C 64 28 58 23 52 23 C 44 23 40 28 39.5 34 C 39 37.5 33 37.5 33 34 Z"/>
      <!-- Dot Extrusion -->
      <circle cx="50" cy="83" r="7.5"/>
    </g>

    <!-- Deep Timber Outline & Warm Face -->
    <g stroke="#25140A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <!-- Hook Body -->
      <path d="M 33 34 C 33 21 43 14 54 14 C 68 14 77 23 77 35 C 77 46 69 52 62 57 C 57 61 55 64 55 69 C 55 71.5 52.5 73 50 73 C 47.5 73 45 71.5 45 69 C 45 61 49 56 55 51 C 60 47 64 43 64 36 C 64 28 58 23 52 23 C 44 23 40 28 39.5 34 C 39 37.5 33 37.5 33 34 Z"
            fill="url(#qFace)"/>
      <!-- Dot Body -->
      <circle cx="50" cy="83" r="7.5" fill="url(#qFace)"/>
    </g>

    <!-- Inner 70s Gloss / Cream Specular Sheen -->
    <path d="M 44 20 C 48 18 54 18 61 21 C 67 24 71 28 71 34"
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <ellipse cx="48" cy="81" rx="2.5" ry="1.8" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>