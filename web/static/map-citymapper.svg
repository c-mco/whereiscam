<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Tram Body -->
  <rect x="5" y="4" width="14" height="15" rx="3" fill="#1E5A3E" stroke="#25140A" stroke-width="1.8"/>
  <!-- Tram Windshield -->
  <rect x="7" y="6" width="10" height="5" rx="1.5" fill="#FFFDF5" stroke="#25140A" stroke-width="1.2"/>
  <!-- Gold Waistline -->
  <line x1="5" y1="13" x2="19" y2="13" stroke="#E5A823" stroke-width="2"/>
  <!-- Headlights -->
  <circle cx="8" cy="15.5" r="1.2" fill="#FFFDF5"/>
  <circle cx="16" cy="15.5" r="1.2" fill="#FFFDF5"/>
  <!-- Tracks / Wheels -->
  <line x1="8" y1="19" x2="8" y2="21" stroke="#25140A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="19" x2="16" y2="21" stroke="#25140A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Trolley Pole -->
  <line x1="12" y1="4" x2="12" y2="2" stroke="#25140A" stroke-width="1.8"/>
  <line x1="9" y1="2" x2="15" y2="2" stroke="#25140A" stroke-width="1.8" stroke-linecap="round"/>
</svg>
